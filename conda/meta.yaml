{% set version_match = load_file_regex(load_file="../src/annunciator/_version.py", regex_pattern='__version__ = "([^"]+)"', from_recipe_dir=True) %}
{% set version = version_match.group(1) %}

package:
  name: annunciator
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - annunciator = annunciator.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
  run:
    - python >=3.9

test:
  imports:
    - annunciator
  commands:
    - annunciator --version

about:
  home: https://github.com/MasonicTombomb/annunciator
  license: MIT
  license_file: LICENSE
  summary: Error, warning and information handling and logging with message catalogues.
