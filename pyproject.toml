[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annunciator"
dynamic = ["version"]
description = "Error, warning and information handling and logging with message catalogues."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tom Scott" }]
keywords = ["logging", "errors", "warnings", "exceptions", "message catalogue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MasonicTombomb/annunciator"
Source = "https://github.com/MasonicTombomb/annunciator"
Changelog = "https://github.com/MasonicTombomb/annunciator/blob/main/CHANGELOG.md"
Issues = "https://github.com/MasonicTombomb/annunciator/issues"

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version < '3.11'"]
docs = ["sphinx>=7.2", "furo>=2024.1"]

[project.scripts]
annunciator = "annunciator.cli:main"

[project.entry-points.pytest11]
annunciator = "annunciator.testing"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
annunciator = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "annunciator._version.__version__" }
